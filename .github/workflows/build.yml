
name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all yt_dlp --name YTMusicVideoDownloader app.py

      - name: Save EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicVideoDownloader-Windows
          path: dist/YTMusicVideoDownloader.exe
