
name: Build Windows Audio EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build audio downloader
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all yt_dlp --name YTMusicAudioDownloader app.py
          Copy-Item (Get-Command ffmpeg).Source dist/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source dist/ffprobe.exe

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicAudioDownloader-Windows
          path: |
            dist/YTMusicAudioDownloader.exe
            dist/ffmpeg.exe
            dist/ffprobe.exe
